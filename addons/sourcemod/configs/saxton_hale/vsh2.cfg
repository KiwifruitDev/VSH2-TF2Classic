"help" {
	"scout"    "Scout:\nPistols get minicrits.\nMedics healing you get a speed-buff."
	
	"soldier"  "Soldier:\nShotguns: minicrit Boss in midair + lower rocketjump damage."
	
	"pyro"     "Pyro:\nFlare Gun: replaced by the Mega Detonator.\nAirblasting Bosses builds Rage and lengthens the Vagineer's uber."
	
	"demo"     "Demoman:\nGrenade Launchers reduces explosive jumping if the weapon is active."
	
	"heavy"    "Heavy:\nShotguns give damage back as some health."
	
	"engie"    "Engineer:\nTelefrags kill Bosses in one shot."
	
	"medic"    "Medic:\nCharge: Kritz+Uber. starts at 40percent.\nCharge lasts for 150 percent after activation.\nSyringe Guns: on hit: +5 to Uber."
	
	"sniper"   "Sniper:\nSniper Rifles causes Certain Bosses to glow. Glow time scales with charge.\nAll Sniper melees climb walls, but has slower rate of fire.\nHuntsman carries 2x more ammo."
	
	"spy"      "Spy:\nBackstab does about 10+ percent of a Boss' max HP.\nAll revolvers minicrit."

	"civilian" "Civilian:\nNo changes"
}

